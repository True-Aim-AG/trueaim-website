# Opens and maintains a release PR from conventional commits on main; merging
# it tags vX.Y.Z and publishes a GitHub release, which is what deploys
# production (see deploy.yml). Uses a fine-grained PAT rather than
# GITHUB_TOKEN because events created with GITHUB_TOKEN never trigger other
# workflows, so a GITHUB_TOKEN-published release would not deploy.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
