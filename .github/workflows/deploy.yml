name: Deploy static website

# Every push to main deploys staging. Production deploys from a published
# GitHub release (created by release-please from the merged release PR); the
# workflow_dispatch path exists only to redeploy an existing release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag (vX.Y.Z) to redeploy to production
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: ${{ vars.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website
          path: |
            out/
            api/
            !api/node_modules/
          if-no-files-found: error
          retention-days: 7

  staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website
      # The contact function's endpoint travels as an environment secret and
      # is written into the function package here, so it is neither in git,
      # in the build artifact, nor in Terraform. Never echoed.
      - name: Configure the contact function
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          set +x
          test -n "$GOOGLE_SCRIPT_URL" || { echo "::error::GOOGLE_SCRIPT_URL secret is not set for this environment"; exit 1; }
          node -e 'require("node:fs").writeFileSync("api/src/generated-config.js", "export const scriptUrl = " + JSON.stringify(process.env.GOOGLE_SCRIPT_URL) + ";\n")'
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out
          api_location: api
          skip_app_build: true
          skip_api_build: false
          output_location: ""

  production:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website
      # The contact function's endpoint travels as an environment secret and
      # is written into the function package here, so it is neither in git,
      # in the build artifact, nor in Terraform. Never echoed.
      - name: Configure the contact function
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          set +x
          test -n "$GOOGLE_SCRIPT_URL" || { echo "::error::GOOGLE_SCRIPT_URL secret is not set for this environment"; exit 1; }
          node -e 'require("node:fs").writeFileSync("api/src/generated-config.js", "export const scriptUrl = " + JSON.stringify(process.env.GOOGLE_SCRIPT_URL) + ";\n")'
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out
          api_location: api
          skip_app_build: true
          skip_api_build: false
          output_location: ""
